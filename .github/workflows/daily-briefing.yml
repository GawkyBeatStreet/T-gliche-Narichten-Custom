name: Meridian Daily Briefing

on:
  schedule:
    - cron: '45 5 * * *' # Täglich exakt 1x um 06:45 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Briefing mit 14-Tage-Rotationsfilter generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > generate.mjs
          import fs from 'node:fs/promises';

          const API_KEY = process.env.GEMINI_API_KEY;
          if (!API_KEY) {
            console.error('FEHLER: GEMINI_API_KEY fehlt!');
            process.exit(1);
          }

          // 1. Frühere Ticker & Themen der letzten 14 Tage aus briefing.json einlesen (Cooldown)
          let recentHistory = [];
          try {
            const oldBriefing = JSON.parse(await fs.readFile('briefing.json', 'utf-8'));
            if (Array.isArray(oldBriefing.recentHistory)) {
              recentHistory = oldBriefing.recentHistory.slice(-14);
            } else if (Array.isArray(oldBriefing.cards)) {
              recentHistory = oldBriefing.cards.map(c => c.company || c.ticker);
            }
          } catch (e) {
            recentHistory = [];
          }

          const blacklistPrompt = recentHistory.length > 0 
            ? `\nBEREITS BEHANDELTE THEMEN/UNTERNEHMEN DER LETZTEN TAGE (STRIKT GESPERRT, WÄHLE ZWINGEND ANDERE!): ${recentHistory.join(', ')}\n`
            : '';

          const RSS_SOURCES = [
            { name: 'WSJ World', url: 'https://feeds.a.dj.com/rss/RSSWorldNews.xml' },
            { name: 'WSJ Markets', url: 'https://feeds.a.dj.com/rss/RSSMarketsMain.xml' },
            { name: 'Handelsblatt', url: 'https://www.handelsblatt.com/contentexport/feed/schlagzeilen' },
            { name: 'Financial Times', url: 'https://www.ft.com/rss/home' },
            { name: 'Tagesschau Wirtschaft', url: 'https://www.tagesschau.de/wirtschaft/index~rss2.xml' },
            { name: 'NZZ International', url: 'https://www.nzz.ch/international.rss' },
            { name: 'Nikkei Asia', url: 'https://asia.nikkei.com/rss/feed/nar' },
            { name: 'CNBC World', url: 'https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100727362' }
          ];

          async function fetchRssHeadlines() {
            const headlines = [];
            for (const src of RSS_SOURCES) {
              try {
                const res = await fetch(src.url, {
                  headers: { 'User-Agent': 'Mozilla/5.0 (compatible; MeridianBot/1.0)' },
                  signal: AbortSignal.timeout(12000)
                });
                if (!res.ok) continue;
                const xml = await res.text();
                const items = [...xml.matchAll(/<item[\s>]([\s\S]*?)<\/item>/gi)].slice(0, 8);
                for (const match of items) {
                  const block = match[1];
                  const title = (block.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/i) || block.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1] || '';
                  const desc = (block.match(/<description><!\[CDATA\[([\s\S]*?)\]\]><\/description>/i) || block.match(/<description[^>]*>([\s\S]*?)<\/description>/i) || [])[1] || '';
                  const cleanTitle = title.replace(/<[^>]+>/g, '').trim();
                  const cleanDesc = desc.replace(/<[^>]+>/g, '').trim().slice(0, 220);
                  if (cleanTitle) headlines.push(`[${src.name}] ${cleanTitle} — ${cleanDesc}`);
                }
              } catch (e) {}
            }
            return headlines.join('\n');
          }

          const MODELS = ['gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-3.8-flash', 'gemini-3.6-flash'];

          function safeParseJSON(raw) {
            const cleaned = String(raw || '').replace(/```json/gi, '').replace(/```/g, '').trim();
            const first = cleaned.indexOf('{'), last = cleaned.lastIndexOf('}');
            if (first === -1 || last <= first) throw new Error('Kein JSON-Objekt');
            const candidate = cleaned.slice(first, last + 1);
            try { return JSON.parse(candidate); } catch { return JSON.parse(candidate.replace(/,\s*([\]}])/g, '$1')); }
          }

          async function callGeminiJSON(promptText) {
            let lastErr = null;
            for (const model of MODELS) {
              try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`;
                const res = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { temperature: 0.25, maxOutputTokens: 6000, responseMimeType: 'application/json' }
                  })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const raw = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
                return safeParseJSON(raw);
              } catch (err) {
                lastErr = err;
              }
            }
            throw lastErr;
          }

          async function main() {
            const rssContext = await fetchRssHeadlines();
            const now = new Date();
            const todayStr = now.toLocaleDateString('de-DE', { timeZone: 'Europe/Berlin', day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' });

            const baseHeader = `Du bist Chefredakteur von 'Meridian' (Global Intelligence). Heute ist der ${todayStr}.
          Verwende in JSON-Strings einfache Anführungszeichen ('...').
          ANTI-NOISE-PFLICHT: Keine Gerüchte, kein Daytrading-Rauschen. Nur Fakten, die durch Leitmedien und Agenturen (Reuters, Bloomberg, dpa) gestützt sind.
          ${blacklistPrompt}
          AKTUELLE SCHLAGZEILEN:
          ${rssContext}\n\n`;

            console.log('1/3 Welt-Dossiers generieren...');
            const worldRes = await callGeminiJSON(baseHeader + `AUFGABE: Erstelle EXAKT 6 Welt- & Makro-Dossiers mit verschiedenen Weltregionen (max 1 pro Region).
          JSON: {
            "worldNews": [
              {
                "region": "REGION · THEMENFELD",
                "title": "Prägnante Überschrift",
                "summary": "1-2 Sätze, was konkret passiert ist.",
                "contextExplanation": "4-5 Sätze Tiefenanalyse (Warum jetzt? Welche Mechanismen stecken dahinter?).",
                "longTermImpact": "2 Sätze zu den 1-5 Jahresfolgen.",
                "hasDivergingNarratives": false,
                "narrativeComparison": "",
                "bullets": ["Fakt 1", "Fakt 2", "Fakt 3"],
                "sources": ["Wall Street Journal", "Handelsblatt", "Reuters"],
                "verificationStatus": "Verifiziert · 3 Quellen"
              }
            ]
          }`);

            console.log('2/3 Markt-Kacheln mit rotierender Slot-Architektur generieren...');
            const cardsRes = await callGeminiJSON(baseHeader + `AUFGABE: Erstelle EXAKT 6 Kapitalmarkt-Kacheln (Horizont 5+ Jahre) nach dieser FESTEN SLOT-ARCHITEKTUR:
          - Slot 1 (equities): Industrie, Automatisierung & Infrastruktur (z.B. Schneider Electric, Siemens, ABB, Deere, Caterpillar, Linde)
          - Slot 2 (equities): Pharma, Medtech oder Konsumgüter mit Preissetzungsmacht (z.B. Novo Nordisk, Intuitive Surgical, LVMH, Nestlé, Stryker)
          - Slot 3 (commodities): Rotierender strategischer Rohstoff (z.B. Silber, Erdgas/TTF, Öl/Brent, Lithium, Seltene Erden, Kakao, Weizen)
          - Slot 4 (commodities): Zweiter Rohstoff oder Frachtraten/Energie
          - Slot 5 (equities): Finanzen, Zinsen & Kapitalmarktmonopole (z.B. Visa, Berkshire Hathaway, BlackRock, Münchner Rück)
          - Slot 6 (crypto): Digitales Netzwerk / Asset (Bitcoin, Ethereum L2, Tokenisierte Real-World-Assets)

          Beachte strikt die Blacklist der letzten Tage! Wähle neue, substanzielle Werte.
          JSON: {
            "cards": [
              {
                "id": "card-1",
                "category": "equities",
                "sectorLabel": "Branche",
                "ticker": "BÖRSE:SYMBOL (z.B. NYSE:ETN, NASDAQ:ISRG, TVC:GOLD)",
                "company": "Name",
                "direction": "Burggraben wächst / Strukturell Bullisch",
                "isPositive": true,
                "moatScore": 92,
                "headline": "Prägnante Überschrift",
                "contextExplanation": "4-5 Sätze tiefgehende Marktmechanik & Burggraben-Erklärung.",
                "thesis": "5-Jahres Bull-Case (2 Sätze).",
                "bearCase": "Wichtigstes Gegenrisiko (2 Sätze).",
                "hasDivergingNarratives": false,
                "narrativeComparison": "",
                "bullets": ["Marktfakt 1", "Marktfakt 2", "Marktfakt 3"],
                "sources": ["Financial Times", "Wall Street Journal"],
                "verificationStatus": "Verifiziert",
                "sparkline": [45, 50, 55, 62, 69, 75, 82, 88]
              }
            ]
          }`);

            console.log('3/3 Tages-Synthese & Makro-Regime-Ampel generieren...');
            const overviewRes = await callGeminiJSON(baseHeader + `AUFGABE: Erstelle die Tages-Synthese, das Anleihen-Dossier und die NEUE MAKRO-REGIME & LIQUIDITÄTS-AMPEL (4 messbare Leit-Indikatoren):
          JSON: {
            "morningSynthesis": "2-3 Sätze zum roten Faden des Tages.",
            "intermarket": {
              "title": "Überschrift zu Staatsanleihen, Renditen & Sachwerten",
              "summary": "2 Sätze Kernaussage.",
              "contextExplanation": "4-5 Sätze verständlicher Hintergrund zum Anleihemarkt.",
              "bearCase": "Gegenszenario.",
              "hasDivergingNarratives": false,
              "narrativeComparison": "",
              "bullets": ["Fakt 1", "Fakt 2", "Fakt 3"],
              "symbol": "TVC:US10Y",
              "sources": ["WSJ", "FT", "Reuters"],
              "verificationStatus": "Verifiziert"
            },
            "macroRegime": [
              {
                "indicator": "US-Dollar & Liquidität (DXY)",
                "phase": "Restriktiv / Neutral / Expansiv",
                "tone": "amber",
                "detail": "1 prägnanter Satz: Was bedeutet das für Schwellenländer und Rohstoffe?"
              },
              {
                "indicator": "Zinskurve (2Y/10Y Spread)",
                "phase": "Steiler werdend / Invertiert / Normalisierend",
                "tone": "green",
                "detail": "1 prägnanter Satz: Was bedeutet das für Banken und Refinanzierung?"
              },
              {
                "indicator": "Kreditrisiko (High-Yield-Spreads)",
                "phase": "Eng / Sorglos / Weit / Gestresst",
                "tone": "green",
                "detail": "1 prägnanter Satz: Wie liquide und krisensicher ist der Unternehmenssektor?"
              },
              {
                "indicator": "Geopolitische Risikoprämie",
                "phase": "Erhöht / Mäßig / Gedämpft",
                "tone": "red",
                "detail": "1 prägnanter Satz: Auswirkung auf Frachtraten und Versicherungskosten."
              }
            ]
          }`);

            // Neue behandelte Ticker & Firmen für das 14-Tage-Gedächtnis sammeln
            const newlyUsed = (cardsRes.cards || []).map(c => c.company || c.ticker);
            const updatedHistory = [...new Set([...recentHistory, ...newlyUsed])].slice(-25);

            const finalBriefing = {
              generatedAt: now.toISOString(),
              lastUpdated: `${todayStr}, ${timeStr} Uhr`,
              morningSynthesis: overviewRes.morningSynthesis || '',
              intermarket: overviewRes.intermarket || null,
              macroRegime: overviewRes.macroRegime || [],
              worldNews: worldRes.worldNews || [],
              cards: (cardsRes.cards || []).map((c, idx) => ({ ...c, id: c.id || `card-${idx + 1}` })),
              recentHistory: updatedHistory
            };

            await fs.writeFile('briefing.json', JSON.stringify(finalBriefing, null, 2), 'utf-8');
            console.log('briefing.json mit 14-Tage-Historie erfolgreich gespeichert!');
          }

          main().catch(err => {
            console.error('Fehler:', err);
            process.exit(1);
          });
          EOF
          node generate.mjs
          rm generate.mjs

      - name: Neue briefing.json committen
        run: |
          git config user.name "Meridian Auto-Publisher"
          git config user.email "actions@github.com"
          git add briefing.json
          git diff --staged --quiet || git commit -m "Auto-Update Meridian Briefing ($(date -u +'%d.%m.%Y %H:%M UTC'))"
          git push
